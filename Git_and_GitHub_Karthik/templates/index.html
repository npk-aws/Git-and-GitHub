<!DOCTYPE html>
<html>
<head>
    <title>Flask MongoDB Form</title>
</head>

<body>

    <h1>Submit Your Details</h1>

    {% if error %}
        <p style="color: red;">
            Error: {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        <label>Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>

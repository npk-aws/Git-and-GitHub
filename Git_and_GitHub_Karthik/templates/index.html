<!DOCTYPE html>
<html>
<head>
    <title>To-Do Application</title>
</head>

<body>

<h1>To-Do Application</h1>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<h2>To-Do Item</h2>

<form method="POST" action="/submittodoitem">

    <label>Item Name:</label>
    <input type="text" name="itemName" required>

    <br><br>

    <label>Item Description:</label>
    <textarea name="itemDescription" required></textarea>

    <br><br>

    <button type="submit">Submit To-Do</button>

</form>

<br><br>

<label>Item ID:</label>
<input type="text" name="itemID">

<br><br>

<label>Item UUID:</label>
<input type="text" name="itemUUID">

<br><br>

<label>Item Hash:</label>
<input type="text" name="itemHash">

</body>
</html>
